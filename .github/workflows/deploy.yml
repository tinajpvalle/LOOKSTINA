name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; se chegarem pushes em sequência, só o último roda.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Disparar deploy no servidor
        # O authorized_keys do servidor tem forced command: qualquer comando
        # enviado é ignorado e o deploy.sh roda no lugar. O ssh só serve de
        # gatilho e retransmite o log/exit code do script.
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" deploy
